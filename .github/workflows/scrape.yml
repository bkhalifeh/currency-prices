name: scrape-derham-prices

on:
  schedule:
    - cron: "35 * * * *"   # a few minutes after the channel's ~:30 UTC post
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - main.py
      - .github/workflows/scrape.yml

permissions:
  contents: write

concurrency:
  group: scrape-derham-prices
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"

      - run: uv run python main.py

      - name: Commit data
        run: |
          if git diff --quiet -- latest.json prices.db; then
            echo "no change"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add latest.json prices.db
          git commit -m "chore: update prices ($(date -u +%FT%TZ))"
          git push
